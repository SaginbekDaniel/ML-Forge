[project]
name = "mlforge-runner"
version = "0.1.0"
description = "Isolated Python execution (Docker) and deterministic grading for ML Forge"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlforge_runner"]
