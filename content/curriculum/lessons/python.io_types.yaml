id: lesson.io_types
version: 1
skill: python.io_types
title: "Ввод, вывод и типы данных"
estimated_minutes: 20
summary: "Как программа получает данные (input), показывает результат (print) и почему \"3\" и 3 — разные вещи."
explanation_md: |
  Любая программа делает три вещи: **получает данные**, **обрабатывает** их и **показывает результат**.

  * `print(...)` выводит значения в консоль (stdout). Несколько аргументов разделяются пробелом.
  * `input()` читает **одну строку** текста, которую ввёл пользователь, и всегда возвращает `str`.
  * У каждого значения есть **тип** (type): `int` — целые числа, `float` — дробные,
    `str` — текст, `bool` — `True`/`False`. Узнать тип можно функцией `type(x)`.
  * Чтобы превратить текст в число, его нужно **явно преобразовать** (type conversion):
    `int("42")`, `float("3.5")`. Обратно — `str(42)`.
  * **f-строки** (f-strings) подставляют значения в текст: `f"Итого: {total:.2f}"` —
    здесь `:.2f` означает «два знака после запятой».

  Python не угадывает за вас, что строка «на самом деле число» — это сделано специально,
  чтобы ошибки были явными.
analogy_md: |
  Представьте окно выдачи заказов. `input()` — это записка от клиента: даже если на ней написано «3»,
  это всё ещё **бумажка с символом**, а не три пирожка. Чтобы посчитать пирожки,
  записку нужно прочитать и превратить в число — это и есть `int(...)`.
definition_md: |
  **Тип данных** (data type) определяет, какие значения может хранить объект и какие операции к нему применимы.
  `input()` возвращает `str`; арифметика с числами требует `int` или `float`.
  Операция `+` для строк означает **склейку** (concatenation), для чисел — **сложение**.
examples:
  - title: "Типы значений"
    code: |
      print(type(7), type(7.0), type("7"), type(True))
    output: "<class 'int'> <class 'float'> <class 'str'> <class 'bool'>"
    note_md: "Одно и то же «7» может быть тремя разными типами."
  - title: "Преобразование и f-строка"
    code: |
      price = "12.5"
      qty = "3"
      total = float(price) * int(qty)
      print(f"Итого: {total:.2f}")
    output: "Итого: 37.50"
    note_md: "Сначала превращаем строки в числа, потом считаем, потом форматируем результат."
common_mistake:
  code: |
    a = "2"
    b = "3"
    print(a + b)
  output: "23"
  problem_md: "Ожидали 5, получили 23: `+` склеил две **строки**. Так ведут себя значения из `input()`."
  fix_md: "Преобразуйте явно: `print(int(a) + int(b))` → `5`."
check_questions:
  - id: q1
    prompt_md: "Что напечатает код?"
    code: |
      x = "5"
      print(x * 3)
    answer: "555"
    explanation_md: "Умножение строки на целое число повторяет её: `\"5\" * 3 == \"555\"`."
  - id: q2
    prompt_md: "Что напечатает код?"
    code: |
      print(int("7") + int(2.9))
    answer: "9"
    explanation_md: "`int(2.9)` **отбрасывает** дробную часть (не округляет): получаем `2`, а `7 + 2 = 9`."
  - id: q3
    prompt_md: "Что напечатает код?"
    code: |
      total = 10 / 4
      print(total, f"{total:.1f}")
    answer: "2.5 2.5"
    explanation_md: "`/` всегда даёт `float`; `:.1f` оставляет один знак после запятой."
recap_md: |
  * `input()` → всегда `str`. Нужны числа — используйте `int()` / `float()`.
  * `+` для строк склеивает, для чисел складывает.
  * `f"{value:.2f}"` — удобный способ вывести число с двумя знаками.
terms:
  - {en: "type conversion", ru: "преобразование типов"}
  - {en: "string", ru: "строка"}
  - {en: "integer", ru: "целое число"}
  - {en: "floating point", ru: "число с плавающей точкой"}
  - {en: "standard output (stdout)", ru: "стандартный вывод"}
resources:
  - {title: "Python Tutorial — An Informal Introduction", url: "https://docs.python.org/3/tutorial/introduction.html"}
  - {title: "Built-in Functions: input, print, int", url: "https://docs.python.org/3/library/functions.html"}
