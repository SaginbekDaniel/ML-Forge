prompt_md: |
  Это **диагностическая** задача: она помогает понять, с чего начать, и не влияет на освоение навыков.
  Подсказок здесь нет — просто попробуйте.

  Напишите функцию `count_even(nums)`, которая возвращает, сколько чётных чисел в списке `nums`.
starter_code: |
  def count_even(nums):
      pass
