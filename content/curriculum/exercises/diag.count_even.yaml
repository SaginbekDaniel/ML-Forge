  - {id: empty, kind: call, visibility: public, call: "count_even([])", expected: "0", tags: [edge_case, empty]}
  - {id: negatives, kind: call, visibility: hidden, call: "count_even([-2, -3, 0])", expected: "2", tags: [edge_case, negative]}
  - {id: none_even, kind: call, visibility: hidden, call: "count_even([1, 3, 5])", expected: "0"}
hints:
  - "(не используются в диагностике)"
  - "(не используются в диагностике)"
  - "(не используются в диагностике)"
solution: |
  def count_even(nums):
      return sum(1 for n in nums if n % 2 == 0)
